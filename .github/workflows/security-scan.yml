name: security-scan

# 시크릿 + 의존성(npm advisory) 스캔 게이트. 폴리레포 표준: controller ci/README.md §보안 스캔
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * 0" # 주간 드리프트 스캔 (UTC 일 20:00 = KST 월 05:00)

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # PR에 결과 코멘트
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 전체 히스토리 스캔 — 과거 커밋에 묻힌 시크릿까지 검출
      # 개인(User) 계정 레포 = GITLEAKS_LICENSE 불요 (organization만 필요, 2026-07-03 확인)
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # LTS (Vite 요구 20.19+/22.12+ 충족)
      # package-lock.json ↔ npm advisory 대조 — node_modules 설치 불필요
      - run: npm audit --audit-level=high
